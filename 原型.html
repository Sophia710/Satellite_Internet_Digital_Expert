- STL 分解的趋势项自昨夜起单调抬升，漂移速率约 0.6 毫秒每分钟。
- 残差中没有新的周期异常，周期性抖动段与轨道周期一致。
- PELT 检出 2 个突变点，与一次切换事件的时间偏差在 90 秒内。

#### 建议动作

1. 核查 7 号链路昨夜的路由配置与切换记录。
