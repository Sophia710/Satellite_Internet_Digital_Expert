面向卫星互联网端到端时延的快速分析技能，帮助定位时延抬升的链路与时间窗口。

## 能力说明
- 按链路、轨道面和采样方向拆分单向时延与往返时延。
- 识别阶跃、尖峰和持续性抬升，标记异常区间。
- 对比不同时间窗的基线，给出趋势判断。

## 输入
- 时延采样：时间戳、链路标识、时延值、采样方向。
- 链路元数据：轨道、频段、星上处理模式。
- 运维记录：链路切换、路由变更和计划维护时间。

## 处理流程
1. 对齐时间基准，剔除无效与重复采样。
2. 计算分位数和基线偏差，定位异常窗口。
3. 关联链路切换与路由变更，排除计划内波动。
4. 输出分链路、分时段的统计摘要。

## 输出
- 时延趋势图与异常点清单。
- 主要抬升区间的归因说明。
- 可复用的分析结论与待确认事项。

## 使用建议
- 明确时延口径后再对比不同链路。
- 采样窗口建议覆盖至少一个完整轨道周期。`},{id:"beam-log-analysis",name:"波束日志分析",icon:"sliders",category:"网络分析",description:"聚合通信波束的接入、切换与功率日志，识别波束拥塞、切换抖动和覆盖空洞。",keywords:["波束","接入","切换","功率","拥塞"],readme:`# 波束日志分析
面向通信波束运行日志的聚合分析技能，用于快速发现波束级异常。

## 能力说明
- 汇总波束接入、释放、切换和功率调整记录。
- 识别接入失败集中、切换抖动和功率长期饱和。
- 结合覆盖网格定位可能的覆盖空洞。

## 输入
- 波束日志：波束编号、时间、终端标识、事件类型、功率值。
- 波束配置：频段、带宽、功率上限、覆盖区域。
- 终端分布：区域、终端类型和业务优先级。

## 处理流程
1. 按波束与时间窗聚合计入、切出和失败事件。
2. 计算切换成功率、拥塞时长与功率余量。
3. 关联相邻波束的重叠关系，判断覆盖空洞。
4. 输出重点波束与异常时段。

## 输出
- 波束健康度摘要。
- 拥塞与切换抖动清单。
- 建议进一步核查的覆盖区域。

## 使用建议
- 分析前确认波束编号与覆盖网格使用同一版本。
- 大流量活动期间应单独设定对比基线。`},{id:"fault-review",name:"故障链路复盘",icon:"alert-triangle",category:"故障诊断",description:"围绕告警与工单还原故障时间线，串联遥测、日志和变更记录，形成可复用的复盘结论。",keywords:["故障","告警","工单","时间线","复盘"],readme:`# 故障链路复盘
将告警、工单、遥测和变更记录串成一条可追溯的故障链路。

## 能力说明
- 按时间顺序还原故障发生、发现、响应和恢复过程。
- 关联涉及链路、设备与变更操作。
- 识别直接原因、放大因素和处置缺口。

## 输入
- 告警与工单记录。
- 相关链路、设备和站点的遥测数据。
- 变更单、值班记录和处置日志。

## 处理流程
1. 统一时间基准，建立事件时间线。
2. 标记关键节点与处置动作。
3. 校验告警触发条件与实际状态是否一致。
4. 汇总原因假设并标注证据强度。

## 输出
- 故障时间线与关键节点。
- 原因分析和影响范围。
- 改进项与后续验证建议。

## 使用建议
- 区分事实、推断和待确认信息。
- 涉及多系统时先确认各自时钟同步状态。`},{id:"telemetry-visual",name:"遥测时序可视化",icon:"grid",category:"数据可视化",description:"将多参数遥测按统一时间轴展开，生成工况泳道、阈值区间与异常点标注。",keywords:["遥测","时序","可视化","阈值","工况"],readme:`# 遥测时序可视化
把多源遥测整理为一张可读的时序视图，服务于故障定位和状态汇报。

## 能力说明
- 将电压、温度、功率、误码率等参数统一到同一时间轴。
- 按设备与工况生成泳道，保留参数之间的对应关系。
- 标注阈值区间、阶跃点和缺失采样。

## 输入
